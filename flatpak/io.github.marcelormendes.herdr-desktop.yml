app-id: io.github.marcelormendes.herdr-desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: herdr-desktop-wrapper.sh
separate-locales: false
default-branch: stable

finish-args:
  # Standard Electron display/input/GPU access.
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  # Host command execution: Herdr Desktop controls the host Herdr engine,
  # its Unix sockets, host PTYs, and SSH tunnels. `flatpak-spawn --host` is
  # an intentional sandbox escape; this bundle is NOT a security boundary.
  - --talk-name=org.freedesktop.Flatpak
  # Herdr API/client sockets and engine configuration. :create is required:
  # a fresh user may have Herdr installed but no config directory yet, and
  # only :create guarantees the sandbox can create the missing directory that
  # carries the core socket mount.
  - --filesystem=xdg-config/herdr:create
  # Host-visible app data under one narrow app-owned parent: chat-image
  # staging and remote-engine bridge sockets. Flatpak 1.14 ignores overlapping
  # nested xdg-data grants (chat-images and remote were not mounted when
  # granted separately), so only the parent is granted; the application
  # creates both children with private 0700 permissions.
  - --filesystem=xdg-data/herdr-desktop:create

modules:
  - name: herdr-desktop
    buildsystem: simple
    build-commands:
      # Pre-packaged Forge output staged by scripts/build-flatpak.mjs; the
      # bundle repackages this directory, it does not rebuild the app. The
      # app source path below is relative to the STAGED manifest location.
      - cp -a flatpak-app/. /app/herdr-desktop/
      - mv /app/herdr-desktop/"Herdr Desktop" /app/herdr-desktop/herdr-desktop
      # Zypak provides Chromium's sandbox under Flatpak; a setuid chrome-sandbox
      # is both unneeded and rejected by flatpak-builder.
      - find /app/herdr-desktop -name chrome-sandbox -exec chmod 0755 {} +
      # Patch the Electron binary so its desktop identity matches the
      # application ID (BaseApp helper derives the filename from FLATPAK_ID).
      - patch-electron-desktop-filename /app/herdr-desktop/resources/app.asar
      - install -Dm755 herdr-desktop-wrapper.sh /app/bin/herdr-desktop-wrapper.sh
      - install -Dm644 io.github.marcelormendes.herdr-desktop.desktop /app/share/applications/io.github.marcelormendes.herdr-desktop.desktop
      - install -Dm644 io.github.marcelormendes.herdr-desktop.metainfo.xml /app/share/metainfo/io.github.marcelormendes.herdr-desktop.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.marcelormendes.herdr-desktop.png
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.marcelormendes.herdr-desktop.svg
    sources:
      # dest renames the dir source into a flatpak-app subdirectory of the
      # module build root; the cp build command above relies on that.
      - type: dir
        path: ../flatpak-app
        dest: flatpak-app
      - type: file
        path: herdr-desktop-wrapper.sh
      - type: file
        path: io.github.marcelormendes.herdr-desktop.desktop
      - type: file
        path: io.github.marcelormendes.herdr-desktop.metainfo.xml
      - type: file
        path: icon-512.png
      - type: file
        path: icon.svg
