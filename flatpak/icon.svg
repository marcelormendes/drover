<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Drover</title>
  <!-- Hard offset shadow: sits 40px down-right of the blue square. -->
  <rect x="152" y="152" width="800" height="800" rx="184" fill="#000000"/>
  <!-- Blue square centered on the 1024 canvas (112..912 = center 512). -->
  <rect x="112" y="112" width="800" height="800" rx="184" fill="#6e91ff" stroke="#000000" stroke-width="32"/>
  <!-- Command glyph centered at (512, 512): its ink spans 180..540 in the
       scaled 720px box, so the group needs translate(152 152). -->
  <g transform="translate(152 152) scale(30)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" stroke="#000000" stroke-width="3.1"/>
    <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" stroke="#f7f7f7" stroke-width="1.8"/>
  </g>
</svg>
